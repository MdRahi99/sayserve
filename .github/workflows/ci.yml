name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — typecheck and tests
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGO_TEST_URI: mongodb://127.0.0.1:27017/sayserve_test
      MONGODB_URI: mongodb://127.0.0.1:27017/sayserve_test
      JWT_SECRET: ci-secret-long-enough-for-the-schema-check
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace @sayserve/api

      - name: Unit tests — pricing and the state machine
        run: npm run test:unit

      - name: Assistant eval — 29 hand-written cases, no model, no keys
        run: npm run test:eval --workspace @sayserve/api

      - name: Integration tests — the whole order lifecycle
        run: npm test

  web:
    name: Web — typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build:web
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: http://localhost:5000
